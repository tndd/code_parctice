name: chatgpt-playwright-browser-bridge-probe

on:
  pull_request:
    branches:
      - master

jobs:
  pack-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Playwright package
        run: python -m pip install playwright==1.57.0
      - name: Download Playwright Chromium headless shell only
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/pw-browsers
        run: python -m playwright install --only-shell chromium
      - uses: actions/upload-artifact@v4
        with:
          name: playwright-headless-shell-1.57.0
          path: pw-browsers
          retention-days: 1
